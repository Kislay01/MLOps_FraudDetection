global:
  scrape_interval: 5s

scrape_configs:
  - job_name: fraud-detection-api
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: orchestrator
    static_configs:
      - targets: ["host.docker.internal:8001"]

  - job_name: stream-producer
    static_configs:
      - targets: ["host.docker.internal:8002"]